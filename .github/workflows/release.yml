name: Release

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
      - beta

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm audit --audit-level=moderate

  browser:
    name: Browser safety
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser

  package-artifact:
    name: Package artifact
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:package
      - run: npm pack --dry-run
      - name: Prepare unique publish dry-run version
        run: npm version "0.0.0-release-check.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" --no-git-tag-version
      - run: npm publish --dry-run --tag beta --provenance

  consumer-matrix:
    name: Astro ${{ matrix.astro }} / Node ${{ matrix.node }} / TS ${{ matrix.typescript }}
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - astro: 4
            node: 18.17.1
            typescript: 5.9.3
          - astro: 5
            node: 18.20.8
            typescript: 5.9.3
          - astro: 6
            node: 22.12.0
            typescript: 6.0.3
          - astro: 7
            node: 22.12.0
            typescript: 6.0.3
          - astro: 7
            node: 24
            typescript: 6.0.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Build packed package in Astro consumer
        env:
          ASTRO_VERSION: ${{ matrix.astro }}
          TYPESCRIPT_VERSION: ${{ matrix.typescript }}
        run: node scripts/verify-consumer.mjs

  release:
    name: Release
    if: github.event_name == 'push'
    needs: [ci, browser, package-artifact, consumer-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
